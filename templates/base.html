{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Bid Review Repair Requests Monitor
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Application CSS -->
    <link
        rel="stylesheet"
        href="{% static 'bids/css/style.css' %}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="border-top mt-5 py-4">
        <div class="container text-center text-muted">
            <small>
                Bid Review Repair Requests Monitor
            </small>
        </div>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
